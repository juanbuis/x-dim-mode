<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dim Mode</title>
  <style>
    /* Same tokens and components as popup.html (X's Nov 2026 design system in
       Dim's navy). The card is Dim's page colour; the page around it is one
       step darker, the way X sits a modal on its overlay. */
    :root {
      color-scheme: dark;
      --bg: hsl(210, 34%, 13%);
      --bg-deep: hsl(210, 34%, 9%);
      --tint: rgba(255, 255, 255, 0.04);
      --hover: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.15);
      --line-soft: rgba(255, 255, 255, 0.08);
      --fg: #F7F9F9;
      --fg-2: hsl(210, 12%, 63%);
      --fg-3: hsl(210, 12%, 40%);
      --brand: #1D9BF0;
      --btn: #F7F9F9;
      --btn-hover: rgba(247, 249, 249, 0.85);
      --btn-fg: #0F1419;
      --danger: #F4212E;
      --success: #00BA7C;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::selection { background: rgba(29, 155, 240, 0.4); }
    body {
      min-height: 100vh;
      font: 15px/20px -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg-deep);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }
    .container {
      max-width: 540px;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line-soft);
      border-radius: 24px;
      padding: 36px;
      position: relative;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    /* Close button: X's round ghost icon button */
    .close-btn {
      position: absolute;
      top: 16px;
      inset-inline-end: 16px;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--fg-2);
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .close-btn:hover { background: var(--hover); color: var(--fg); }
    .close-btn svg { width: 20px; height: 20px; }

    /* Header */
    .icon { width: 56px; height: 56px; margin-bottom: 16px; border-radius: 14px; }
    h1 { font-size: 23px; line-height: 28px; font-weight: 800; margin-bottom: 2px; }
    .version { font-size: 13px; line-height: 16px; color: var(--fg-2); margin-bottom: 32px; }

    /* Heading & subtitle */
    .heading { font-size: 20px; line-height: 24px; font-weight: 800; margin-bottom: 8px; }
    .subtitle { font-size: 15px; line-height: 22px; color: var(--fg-2); margin-bottom: 20px; }
    /* On the update screen the subtitle moves down to introduce the bullet
       list, where it needs air above it instead of sitting on the email box. */
    .subtitle.leads-list { margin-top: 28px; margin-bottom: 8px; }

    /* Feature list */
    .features { list-style: none; padding-bottom: 4px; }
    .features li {
      font-size: 15px;
      line-height: 20px;
      color: var(--fg-2);
      padding: 7px 0;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .features li::before {
      content: "";
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
      margin-top: 7px;
    }

    /* Pill buttons: X's primary is white on dark, secondary an outline */
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 8px; }
    .btn-primary, .btn-secondary {
      display: inline-flex;
      align-items: center;
      height: 40px;
      padding: 0 20px;
      border-radius: 999px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.2s;
    }
    .btn-primary { border: none; background: var(--btn); color: var(--btn-fg); }
    .btn-primary:hover { background: var(--btn-hover); }
    .btn-secondary { border: 1px solid var(--line); background: transparent; color: var(--fg); }
    .btn-secondary:hover { background: var(--hover); }

    /* Email form: X's info surface (brand tint), field and button in one pill */
    .email-section {
      background: color-mix(in srgb, var(--brand) 10%, var(--bg));
      border: 1px solid color-mix(in srgb, var(--brand) 22%, transparent);
      border-radius: 16px;
      padding: 20px;
      margin-top: 8px;
      text-align: start;
    }
    .email-label { font-size: 15px; line-height: 22px; color: var(--fg-2); margin-bottom: 14px; }
    .email-label strong {
      display: block;
      color: var(--fg);
      font-size: 17px;
      line-height: 22px;
      font-weight: 800;
      margin-bottom: 2px;
    }
    .email-row {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.18);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .email-row:focus-within { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
    .email-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 14px;
      border: none;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      outline: none;
    }
    .email-input::placeholder { color: var(--fg-2); }
    .email-btn {
      height: 40px;
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: var(--btn);
      color: var(--btn-fg);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }
    .email-btn:hover { background: var(--btn-hover); }
    .email-btn:disabled { opacity: 0.7; cursor: default; }

    /* Success / error */
    .email-success { display: none; font-size: 14px; line-height: 18px; color: var(--success); padding-top: 10px; }
    .follow-cta { display: block; margin-top: 6px; font-size: 14px; color: var(--brand); text-decoration: none; }
    .follow-cta:hover { text-decoration: underline; text-underline-offset: 2px; }
    .email-error { display: none; font-size: 13px; line-height: 16px; color: var(--danger); padding-top: 8px; }

    /* Pin hint (install only) */
    .pin-hint {
      display: none;
      position: fixed;
      top: 14px;
      /* Logical, not physical: Chrome mirrors its toolbar in RTL, so on Arabic
         the extensions button is top-left and the hint has to follow it. */
      inset-inline-end: 28px;
      z-index: 2;
      max-width: 260px;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 18px;
      color: var(--fg-2);
      text-align: start;
    }
    .pin-hint.show { display: flex; }
    .pin-copy strong { display: block; color: var(--fg); font-size: 14px; margin-bottom: 2px; }
    .pin-point {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      animation: pin-bob 1.6s ease-in-out infinite;
    }
    .pin-chip {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--hover);
      border: 1px solid var(--line);
    }
    .pin-chip svg { width: 16px; height: 16px; fill: var(--fg-2); }
    .pin-arrow { width: 16px; height: 16px; color: var(--brand); }
    @keyframes pin-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pin-point { animation: none; }
    }
    @media (max-width: 900px) {
      .pin-hint.show { display: none; }
    }

    /* Cross-promo (update screen only): a quiet "same maker" note, not an ad.
       Muted card, small logo, no button; the byline is sentence case. */
    .promo {
      display: none;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
      padding: 14px 16px;
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .promo.show { display: flex; }
    .promo:hover { background: var(--hover); }
    .promo-icon { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }
    .promo-copy { min-width: 0; }
    .promo-eyebrow { display: block; font-size: 13px; line-height: 16px; color: var(--fg-2); margin-bottom: 2px; }
    .promo-name { display: block; font-size: 15px; line-height: 20px; font-weight: 700; color: var(--fg); }
    .promo-desc { display: block; font-size: 13px; line-height: 18px; color: var(--fg-2); }

    /* Footer */
    .footer { margin-top: 20px; font-size: 13px; line-height: 16px; color: var(--fg-2); text-align: center; }
    .footer a { color: var(--brand); text-decoration: none; }
    .footer a:hover { text-decoration: underline; text-underline-offset: 2px; }
  </style>
</head>
<body>
  <!-- Install-only: points at the toolbar puzzle icon so people can pin the
       extension. Hidden under 900px, where the card and the hint would fight
       for the same space and the toolbar position is less predictable. -->
  <div class="pin-hint" id="pinHint">
    <span class="pin-point" aria-hidden="true">
      <!-- Chrome's own extensions glyph, in a chip shaped like the toolbar
           button, so the shape people are hunting for is right in front of
           them rather than only described in words. -->
      <svg class="pin-arrow" viewBox="0 0 24 24"><path d="M12 20V5m-7 7 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="pin-chip">
        <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg>
      </span>
    </span>
    <span class="pin-copy">
      <strong id="pinHintTitle"></strong>
      <span id="pinHintText"></span>
    </span>
  </div>

  <div class="container">
    <button class="close-btn" id="closeBtn" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <img class="icon" src="icons/icon128.png" alt="">
    <h1>Dim Mode</h1>
    <p class="version" id="version"></p>

    <h2 class="heading" id="heading"></h2>
    <p class="subtitle" id="subtitle"></p>

    <!-- The email ask sits directly under the subtitle: it used to live below
         six bullets and a "Try it now" button that navigates to x.com, which
         put it ~160px below the fold on a 1280x800 laptop. Almost nobody
         scrolled back to it. -->
    <div class="email-section">
      <p class="email-label" id="emailLabel"></p>
      <form class="email-row" id="emailForm"
            action="https://assets.mailerlite.com/jsonp/1436119/forms/179598724460184835/subscribe"
            method="POST">
        <input type="hidden" name="ml-submit" value="1">
        <input type="hidden" name="anticsrf" value="true">
        <input type="hidden" name="fields[signup_source]" id="emailSource" value="">
        <input class="email-input" type="email" name="fields[email]" placeholder="you@email.com" required id="emailInput">
        <button class="email-btn" type="submit" id="subscribeBtn"></button>
      </form>
      <p class="email-success" id="emailSuccess"></p>
      <a class="follow-cta" id="followCta" href="https://x.com/juanbuis" target="_blank" style="display: none;"></a>
      <p class="email-error" id="emailError"></p>
    </div>

    <div class="actions" id="actions"></div>

    <ul class="features" id="features"></ul>

    <!-- Shown on the update screen only. Every release reaches the whole
         install base, which makes this the one recurring launch surface the
         project has. Local image: the extension makes no remote requests. -->
    <a class="promo" id="promo" target="_blank" rel="noopener">
      <img class="promo-icon" src="icons/recipetables96.png" alt="">
      <span class="promo-copy">
        <span class="promo-eyebrow" id="promoEyebrow"></span>
        <span class="promo-name" id="promoName"></span>
        <span class="promo-desc" id="promoDesc"></span>
      </span>
    </a>

  </div>
  <p class="footer">A project by <a href="https://juanbuis.com" target="_blank">Juan Buis</a> — <a href="https://x.com/juanbuis" target="_blank">follow me on X for updates</a> :)</p>

  <script src="rate.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
