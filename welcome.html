<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>X Dim Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0D1117;
      color: #E7E9EA;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(ellipse at center, rgba(29, 155, 240, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .container {
      max-width: 540px;
      width: 100%;
      background: #15202B;
      border: 1px solid #38444D;
      border-radius: 16px;
      padding: 36px;
      position: relative;
      z-index: 1;
    }

    /* Close button */
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #536471;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #E7E9EA;
    }

    /* Header */
    .icon {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
      border-radius: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .version {
      font-size: 14px;
      color: #536471;
      margin-bottom: 32px;
    }

    /* Heading & subtitle */
    .heading {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: #8B98A5;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    /* On the update screen the subtitle moves down to introduce the bullet
       list, where it needs air above it instead of sitting on the email box. */
    .subtitle.leads-list {
      margin-top: 26px;
      margin-bottom: 8px;
    }

    /* Feature list */
    .features {
      list-style: none;
      margin-bottom: 0;
      padding-bottom: 4px;
    }
    .features li {
      font-size: 15px;
      color: #8B98A5;
      padding: 8px 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
    }
    .features li::before {
      content: "";
      flex-shrink: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1D9BF0;
      margin-top: 8px;
    }

    /* Action buttons */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
      margin-bottom: 8px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      height: 40px;
      padding: 0 20px;
      border-radius: 20px;
      border: none;
      background: #1D9BF0;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      height: 40px;
      padding: 0 20px;
      border-radius: 20px;
      border: 1px solid #38444D;
      background: transparent;
      color: #E7E9EA;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .btn-secondary:hover {
      border-color: #1D9BF0;
      color: #1D9BF0;
    }
    /* Email form */
    .email-section {
      background: rgba(29, 155, 240, 0.12);
      border: 1px solid rgba(29, 155, 240, 0.30);
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
      text-align: left;
    }
    .email-label {
      font-size: 15px;
      color: #8B98A5;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .email-label strong {
      color: #E7E9EA;
      font-size: 17px;
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }
    .email-row {
      display: flex;
      border-radius: 24px;
      border: 1px solid #38444D;
      overflow: hidden;
      transition: border-color 0.2s;
      margin: 0;
    }
    .email-row:focus-within { border-color: #1D9BF0; }
    .email-input {
      flex: 1;
      height: 44px;
      padding: 0 16px;
      border: none;
      background: transparent;
      color: #E7E9EA;
      font-size: 14px;
      outline: none;
    }
    .email-input::placeholder { color: #536471; }
    .email-btn {
      height: 44px;
      padding: 0 22px;
      border: none;
      background: #1D9BF0;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .email-btn:hover { opacity: 0.85; }
    .email-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* Success state */
    .email-success {
      display: none;
      font-size: 14px;
      color: #00BA7C;
      padding: 10px 0 0;
      margin: 0;
    }
    .follow-cta {
      display: block;
      margin-top: 6px;
      font-size: 14px;
      color: #1D9BF0;
      text-decoration: none;
    }
    .follow-cta:hover { text-decoration: underline; }
    .email-error {
      display: none;
      font-size: 13px;
      color: #F4212E;
      padding: 8px 0 0;
      margin: 0;
    }

    /* Pin hint (install only) */
    .pin-hint {
      display: none;
      position: fixed;
      top: 14px;
      /* Logical, not physical: Chrome mirrors its toolbar in RTL, so on Arabic
         the extensions button is top-left and the hint has to follow it. */
      inset-inline-end: 28px;
      z-index: 2;
      max-width: 260px;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.45;
      color: #8B98A5;
      text-align: start;
    }
    .pin-hint.show { display: flex; }
    .pin-copy strong {
      display: block;
      color: #E7E9EA;
      font-size: 14px;
      margin-bottom: 2px;
    }
    .pin-point {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      animation: pin-bob 1.6s ease-in-out infinite;
    }
    .pin-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid #38444D;
    }
    .pin-chip svg {
      width: 16px;
      height: 16px;
      fill: #8B98A5;
    }
    .pin-arrow {
      font-size: 16px;
      line-height: 1;
      color: #1D9BF0;
    }
    @keyframes pin-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pin-point { animation: none; }
    }
    @media (max-width: 900px) {
      .pin-hint.show { display: none; }
    }

    /* Cross-promo (update screen only) — deliberately quiet: this is a
       "same maker" note, not an ad. Muted card, small logo, no button. */
    .promo {
      display: none;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
      padding: 14px 16px;
      border: 1px solid #38444D;
      border-radius: 12px;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .promo.show { display: flex; }
    .promo:hover {
      border-color: #536471;
      background: rgba(255, 255, 255, 0.03);
    }
    .promo-icon {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      flex-shrink: 0;
    }
    .promo-copy { min-width: 0; }
    .promo-eyebrow {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #536471;
      margin-bottom: 3px;
    }
    .promo-name {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #E7E9EA;
      margin-bottom: 2px;
    }
    .promo-desc {
      display: block;
      font-size: 13px;
      line-height: 1.4;
      color: #8B98A5;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #536471;
      text-align: center;
      z-index: 1;
    }
    .footer a {
      color: #1D9BF0;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Install-only: points at the toolbar puzzle icon so people can pin the
       extension. Hidden under 900px, where the card and the hint would fight
       for the same space and the toolbar position is less predictable. -->
  <div class="pin-hint" id="pinHint">
    <span class="pin-point" aria-hidden="true">
      <!-- Chrome's own extensions glyph, in a chip shaped like the toolbar
           button, so the shape people are hunting for is right in front of
           them rather than only described in words. -->
      <span class="pin-arrow">&uarr;</span>
      <span class="pin-chip">
        <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7 1.49 0 2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg>
      </span>
    </span>
    <span class="pin-copy">
      <strong id="pinHintTitle"></strong>
      <span id="pinHintText"></span>
    </span>
  </div>

  <div class="container">
    <button class="close-btn" id="closeBtn" title="Close">&times;</button>
    <img class="icon" src="icons/icon128.png" alt="">
    <h1>X Dim Mode</h1>
    <p class="version" id="version"></p>

    <h2 class="heading" id="heading"></h2>
    <p class="subtitle" id="subtitle"></p>

    <!-- The email ask sits directly under the subtitle: it used to live below
         six bullets and a "Try it now" button that navigates to x.com, which
         put it ~160px below the fold on a 1280x800 laptop. Almost nobody
         scrolled back to it. -->
    <div class="email-section">
      <p class="email-label" id="emailLabel"></p>
      <form class="email-row" id="emailForm"
            action="https://assets.mailerlite.com/jsonp/1436119/forms/179598724460184835/subscribe"
            method="POST">
        <input type="hidden" name="ml-submit" value="1">
        <input type="hidden" name="anticsrf" value="true">
        <input type="hidden" name="fields[signup_source]" id="emailSource" value="">
        <input class="email-input" type="email" name="fields[email]" placeholder="you@email.com" required id="emailInput">
        <button class="email-btn" type="submit" id="subscribeBtn"></button>
      </form>
      <p class="email-success" id="emailSuccess"></p>
      <a class="follow-cta" id="followCta" href="https://x.com/juanbuis" target="_blank" style="display: none;"></a>
      <p class="email-error" id="emailError"></p>
    </div>

    <div class="actions" id="actions"></div>

    <ul class="features" id="features"></ul>

    <!-- Shown on the update screen only. Every release reaches the whole
         install base, which makes this the one recurring launch surface the
         project has. Local image: the extension makes no remote requests. -->
    <a class="promo" id="promo" target="_blank" rel="noopener">
      <img class="promo-icon" src="icons/recipetables96.png" alt="">
      <span class="promo-copy">
        <span class="promo-eyebrow" id="promoEyebrow"></span>
        <span class="promo-name" id="promoName"></span>
        <span class="promo-desc" id="promoDesc"></span>
      </span>
    </a>

  </div>
  <p class="footer">A project by <a href="https://juanbuis.com" target="_blank">Juan Buis</a> — <a href="https://x.com/juanbuis" target="_blank">follow me on X for updates</a> :)</p>

  <script src="welcome.js"></script>
</body>
</html>
