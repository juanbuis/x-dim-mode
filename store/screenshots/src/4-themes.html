<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="shots.css">
<style>
  .win { top: 204px; }
  .win img { position: absolute; left: 0; top: 0; }
  .names { position: absolute; left: 64px; top: 164px; width: 1152px; display: flex; }
  .names b { flex: 1; text-align: center; font-size: 17px; line-height: 22px; font-weight: 500; letter-spacing: -0.01em; color: #86868b; }
</style>
<body>
<h1 style="top:54px">Dim, or any shade you like.</h1>
<div class="names"><b>Dim</b><b>Slate</b><b>Jade</b><b>Plum</b><b>Dusk</b><b>Ember</b></div>
<div class="win" id="win"></div>
<script>
  // The same page captured in each theme, one sixth of the width apiece.
  const win = document.getElementById("win"), W = 1152, w = W / 6;
  ["dim", "slate", "jade", "plum", "dusk", "ember"].forEach((id, i) => {
    const im = new Image(); im.src = `img/s4-${id}.png`; im.width = W; im.alt = "";
    im.style.clipPath = `inset(0 ${W - (i + 1) * w}px 0 ${i * w}px)`;
    win.appendChild(im);
    if (i) win.insertAdjacentHTML("beforeend", `<div style="position:absolute;top:0;bottom:0;left:${i * w}px;width:1px;background:rgba(255,255,255,.16);z-index:1"></div>`);
  });
</script>
</body>
